<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anti-Vision">
<meta name="theme-color" content="#ffffff">
<title>Anti-Vision</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<style>
:root{--bg:#fff;--bg2:#f5f5f4;--txt:#1a1a1a;--txt2:#6b6b6b;--txt3:#b0b0b0;--brd:rgba(0,0,0,0.12);--brd2:rgba(0,0,0,0.22);--d-bg:#fcebeb;--d-brd:#f09595;--d-txt:#a32d2d;--i-bg:#e6f1fb;--i-brd:#85b7eb;--i-txt:#185fa5;--s-bg:#eaf3de;--s-txt:#3b6d11;--w-bg:#faeeda;--w-txt:#854f0b;--r:8px;--rl:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--bg2:#2c2c2e;--txt:#f2f2f7;--txt2:#aeaeb2;--txt3:#636366;--brd:rgba(255,255,255,0.12);--brd2:rgba(255,255,255,0.25);--d-bg:#3d1f1f;--d-brd:#7a3030;--d-txt:#f09595;--i-bg:#1a2f47;--i-brd:#2e5a8a;--i-txt:#85b7eb;--s-bg:#1e2f14;--s-txt:#97c459;--w-bg:#2e2210;--w-txt:#ef9f27}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;min-height:100vh}
input,textarea,button{font-family:inherit;color:var(--txt)}
textarea,input[type=text],input[type=password]{background:var(--bg);border:0.5px solid var(--brd2);border-radius:var(--r);padding:.75rem 1rem;font-size:15px;line-height:1.6;width:100%;resize:none}
textarea:focus,input:focus{outline:none;border-color:var(--txt2)}
textarea::placeholder,input::placeholder{color:var(--txt3)}
input[type=range]{width:100%;accent-color:var(--txt)}
#app{max-width:480px;margin:0 auto;padding:1rem 1rem 5rem}
.hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:1rem;border-bottom:0.5px solid var(--brd);margin-bottom:1.25rem}
.logo{font-size:12px;font-weight:500;color:var(--txt2);letter-spacing:.12em;text-transform:uppercase}
.badge{font-size:11px;background:var(--bg2);border:0.5px solid var(--brd);color:var(--txt2);padding:3px 10px;border-radius:20px}
.card{background:var(--bg);border:0.5px solid var(--brd);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:10px}
.card-d{background:var(--d-bg);border:0.5px solid var(--d-brd);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:10px}
.card-i{background:var(--i-bg);border:0.5px solid var(--i-brd);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:10px}
.lbl{font-size:11px;font-weight:500;color:var(--txt2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.lbl-d{font-size:11px;font-weight:500;color:var(--d-txt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.lbl-i{font-size:11px;font-weight:500;color:var(--i-txt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.lbl-s{font-size:11px;font-weight:500;color:var(--s-txt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.lbl-w{font-size:11px;font-weight:500;color:var(--w-txt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.txt{font-size:14px;color:var(--txt);line-height:1.6}
.h1{font-size:22px;font-weight:500;color:var(--txt);line-height:1.3;margin-bottom:.5rem}
.sub{font-size:14px;color:var(--txt2);line-height:1.6}
.qnum{font-size:11px;color:var(--txt2);margin-bottom:6px}
.qtxt{font-size:16px;font-weight:500;line-height:1.5;margin-bottom:.5rem}
.hint{font-size:13px;color:var(--txt2);line-height:1.5;margin-bottom:.75rem}
.btn-p{background:var(--txt);color:var(--bg);border:none;border-radius:var(--r);padding:.75rem 1.5rem;font-size:15px;font-weight:500;cursor:pointer;width:100%;display:block;margin-bottom:8px}
.btn-s{background:transparent;color:var(--txt2);border:0.5px solid var(--brd2);border-radius:var(--r);padding:.75rem 1.5rem;font-size:14px;cursor:pointer;width:100%;display:block;margin-bottom:8px}
.btn-icon{background:none;border:none;cursor:pointer;color:var(--txt2);font-size:22px;padding:4px;line-height:1}
.btn-back{background:none;border:none;cursor:pointer;color:var(--txt2);font-size:14px;display:flex;align-items:center;gap:6px;padding:0}
.btn-mode{background:var(--bg);border:0.5px solid var(--brd);border-radius:var(--rl);padding:.9rem 1.25rem;text-align:left;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.icon-box{width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.prog-bar{height:3px;background:var(--bg2);border-radius:2px;overflow:hidden;margin-top:8px;margin-bottom:1.25rem}
.prog-fill{height:100%;background:var(--txt);border-radius:2px;transition:width .3s}
.metric{background:var(--bg2);border-radius:var(--r);padding:.75rem;text-align:center}
.nav{position:fixed;bottom:0;left:0;right:0;border-top:0.5px solid var(--brd);display:flex;background:var(--bg);padding:8px 0 12px;z-index:100}
.nav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10px;color:var(--txt3)}
.nav-btn.active{color:var(--txt)}
.nav-btn i{font-size:22px}
.checkin-q{border-top:0.5px solid var(--brd);border-bottom:0.5px solid var(--brd);padding:1.5rem 0;margin-bottom:1.25rem;text-align:center;font-size:17px;font-weight:500;line-height:1.5}
.done-center{text-align:center;padding:3rem 0 2rem}
.try-item{display:flex;gap:10px;margin-bottom:10px}
.try-num{width:22px;height:22px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--txt2);flex-shrink:0;margin-top:2px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:1.25rem}
.sep{border-top:0.5px solid var(--brd);margin:1.5rem 0 1.25rem}
.tldr{font-size:13px;color:var(--i-txt);border-left:2px solid var(--i-brd);padding:1px 0 1px 10px;line-height:1.5;margin-bottom:.75rem}
.orig-box{font-size:12px;color:var(--txt2);background:var(--bg2);border-radius:var(--r);padding:10px 12px;line-height:1.7;margin-bottom:.75rem}
.btn-orig{background:none;border:none;color:var(--txt3);font-size:12px;padding:0;cursor:pointer;margin-bottom:.75rem;text-decoration:underline}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>

function lsget(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsset(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsdel(k){try{localStorage.removeItem(k);}catch(e){}}

function OHdr(p){
  return ce("div",{className:"hdr"},
    ce("button",{className:"btn-back",onClick:p.onBack},ce("i",{className:"ti ti-arrow-left"})," 戻る"),
    ce("span",{style:{fontSize:14,fontWeight:500}},p.title),
    ce("span",{style:{width:60}}));
}

function Chart(p){
  var data=p.data;
  if(!data||!data.length)return ce("div",{style:{textAlign:"center",padding:"1.5rem",fontSize:14,color:"var(--txt2)"}},"週次の深掘りを記録するとグラフが表示されます");
  var W=320,H=110,pl=24,pr=8,pt=8,pb=22,iW=W-pl-pr,iH=H-pt-pb,n=data.length;
  function px(i){return pl+(n<2?iW/2:i/(n-1)*iW);}
  function py(s){return pt+iH-(s-1)/9*iH;}
  var pts=data.map(function(d,i){return {x:px(i),y:py(d.score),s:d.score,dt:d.date};});
  var poly=pts.map(function(p){return p.x+","+p.y;}).join(" ");
  var lblIdx=n<=6?data.map(function(_,i){return i;}):data.map(function(_,i){return i;}).filter(function(i){return i===0||i===n-1||i%Math.ceil(n/5)===0;});
  return ce("svg",{viewBox:"0 0 "+W+" "+H,width:"100%",style:{display:"block"}},
    [1,5,10].map(function(v){return ce("g",{key:v},
      ce("line",{x1:pl,y1:py(v),x2:W-pr,y2:py(v),stroke:"rgba(0,0,0,0.08)",strokeWidth:0.5,strokeDasharray:"3 3"}),
      ce("text",{x:pl-3,y:py(v)+4,fontSize:9,fill:"var(--txt2)",textAnchor:"end"},v));}),
    ce("polyline",{points:poly,fill:"none",stroke:"var(--txt)",strokeWidth:2,strokeLinejoin:"round",strokeLinecap:"round"}),
    pts.map(function(p,i){return ce("circle",{key:i,cx:p.x,cy:p.y,r:3,fill:"var(--txt)"});}),
    lblIdx.map(function(i){return ce("text",{key:i,x:px(i),y:H-5,fontSize:9,fill:"var(--txt2)",textAnchor:"middle"},data[i].date);})
  );
}

      ce("div",{className:"card"},ce("div",{className:"lbl",style:{marginBottom:12}},"週次スコア推移"),ce(Chart,{data:chartData})),
      weeklyLogs.slice(0,3).map(function(l){
        return l.tries&&l.tries.length?ce("div",{key:l.date,className:"card"},
          ce("div",{className:"lbl",style:{marginBottom:8}},l.date+" のTry提案"),
          l.tries.map(function(t,i){return ce("div",{key:i,className:"try-item"},ce("div",{className:"try-num"},i+1),ce("div",{style:{fontSize:13,lineHeight:1.5}},t));})):null;
      })
    );
  }

  function TabMilestones(){
    return ce("div",null,
      ce("div",{className:"hdr"},ce("span",{className:"logo"},"目標")),
      ce("div",{className:"sub",style:{marginBottom:"1.25rem"}},"週次の深掘りで自動更新されます(直接編集も可)"),
      [{key:"year",label:"1年後のゴール",hint:"メインミッション",icon:"ti-trophy",cls:"lbl-w"},
       {key:"month",label:"1ヶ月後のプロジェクト",hint:"ボス戦",icon:"ti-target",cls:"lbl-i"},
       {key:"week",label:"今週のアクション",hint:"デイリークエスト",icon:"ti-list-check",cls:"lbl-s"},
       {key:"constraints",label:"制約(やらないこと)",hint:"ルール",icon:"ti-shield-lock",cls:"lbl-d"}
      ].map(function(item){
        return ce("div",{key:item.key,className:"card"},
          ce("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:8}},
            ce("i",{className:"ti "+item.icon,style:{fontSize:16}}),
            ce("div",{className:item.cls},item.label),
            ce("div",{style:{fontSize:11,color:"var(--txt3)",marginLeft:"auto"}},item.hint)),
          ce("textarea",{value:milestones[item.key]||"",onChange:function(e){var k=item.key;setMilestones(function(m){var n=Object.assign({},m);n[k]=e.target.value;lsset("av-milestones",n);return n;});},rows:3,placeholder:"ここに書く..."}));
      })
    );
  }

  function TabHistory(){
    return ce("div",null,
      ce("div",{className:"hdr"},ce("span",{className:"logo"},"履歴"),ce("span",{className:"badge"},(hist.length+1)+"バージョン")),
      ce("div",{className:"card-d"},
        ce("div",{className:"lbl-d"},"現在のアンチビジョン"),ce("div",{className:"txt",style:{fontSize:13,marginTop:4}},cfg.antivision),
        ce("div",{className:"lbl-i",style:{marginTop:12}},"現在のビジョン"),ce("div",{className:"txt",style:{fontSize:13,marginTop:4}},cfg.vision)),
      !hist.length?ce("div",{className:"card",style:{textAlign:"center",padding:"2rem"}},ce("div",{style:{fontSize:14,color:"var(--txt2)"}},"週次の深掘りでアンチビジョン/ビジョンが変わると、ここに履歴が残ります")):
      hist.map(function(hh,i){
        return ce("div",{key:i,className:"card"},
          ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},
            ce("div",{style:{fontSize:13,fontWeight:500}},"バージョン "+(hist.length-i)),
            ce("div",{style:{fontSize:11,color:"var(--txt2)"}},hh.date)),
          ce("div",{style:{fontSize:13,color:"var(--txt2)",lineHeight:1.5,marginBottom:10}},hh.antivision),
          ce("button",{className:"btn-s",style:{fontSize:12,padding:"6px 12px",width:"auto",marginBottom:0},onClick:function(){setDiffItem(hh);setScreen("verdiff");}},
            ce("i",{className:"ti ti-git-compare",style:{marginRight:4}}),"現在と比較"));
      })
    );
  }

  if(screen==="verdiff"&&diffItem)return ce("div",null,
    ce(OHdr,{title:"バージョン比較",onBack:function(){setDiffItem(null);setScreen("main");setTab("history");}}),
    ce("div",{className:"sub",style:{marginBottom:"1.25rem"}},diffItem.date+" のバージョンと現在を比較"),
    ce("div",{className:"lbl"},"アンチビジョン"),
    ce("div",{className:"card-d",style:{marginTop:4}},ce("div",{className:"lbl-d"},"旧"),ce("div",{className:"txt",style:{fontSize:13,marginTop:4}},diffItem.antivision)),
    ce("div",{className:"card"},ce("div",{className:"lbl"},"現在"),ce("div",{className:"txt",style:{fontSize:13,marginTop:4}},cfg.antivision)),
    ce("div",{className:"lbl",style:{marginTop:8}},"ビジョン"),
    ce("div",{className:"card",style:{marginTop:4}},ce("div",{className:"lbl"},"旧"),ce("div",{className:"txt",style:{fontSize:13,marginTop:4}},diffItem.vision)),
    ce("div",{className:"card-i"},ce("div",{className:"lbl-i"},"現在"),ce("div",{className:"txt",style:{fontSize:13,marginTop:4}},cfg.vision))
  );

  var TABS=[{id:"home",icon:"ti-home",label:"ホーム"},{id:"progress",icon:"ti-chart-line",label:"進捗"},{id:"milestones",icon:"ti-target",label:"目標"},{id:"history",icon:"ti-history",label:"履歴"}];
  return ce("div",null,
    ce("div",{id:"app"},
      tab==="home"&&ce(TabHome,null),
      tab==="progress"&&ce(TabProgress,null),
      tab==="milestones"&&ce(TabMilestones,null),
      tab==="history"&&ce(TabHistory,null)),
    ce("nav",{className:"nav"},
      TABS.map(function(t){return ce("button",{key:t.id,className:"nav-btn"+(tab===t.id?" active":""),onClick:function(){setTab(t.id);setScreen("main");}},
        ce("i",{className:"ti "+t.icon}),ce("span",null,t.label));})
  ));
}

ReactDOM.createRoot(document.getElementById("app")).render(ce(App));
})();
</script>
</body>
</html>
