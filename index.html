<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anti-Vision">
<meta name="theme-color" content="#ffffff">
<title>Anti-Vision</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<style>
:root{--bg:#fff;--bg2:#f5f5f4;--txt:#1a1a1a;--txt2:#6b6b6b;--txt3:#b0b0b0;--brd:rgba(0,0,0,0.12);--brd2:rgba(0,0,0,0.22);--d-bg:#fcebeb;--d-brd:#f09595;--d-txt:#a32d2d;--i-bg:#e6f1fb;--i-brd:#85b7eb;--i-txt:#185fa5;--s-bg:#eaf3de;--s-txt:#3b6d11;--w-bg:#faeeda;--w-txt:#854f0b;--r:8px;--rl:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--bg2:#2c2c2e;--txt:#f2f2f7;--txt2:#aeaeb2;--txt3:#636366;--brd:rgba(255,255,255,0.12);--brd2:rgba(255,255,255,0.25);--d-bg:#3d1f1f;--d-brd:#7a3030;--d-txt:#f09595;--i-bg:#1a2f47;--i-brd:#2e5a8a;--i-txt:#85b7eb;--s-bg:#1e2f14;--s-txt:#97c459;--w-bg:#2e2210;--w-txt:#ef9f27}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;min-height:100vh}
input,textarea,button{font-family:inherit;color:var(--txt)}
textarea,input[type=text],input[type=password]{background:var(--bg);border:0.5px solid var(--brd2);border-radius:var(--r);padding:.75rem 1rem;font-size:15px;line-height:1.6;width:100%;resize:none}
textarea:focus,input:focus{outline:none;border-color:var(--txt2)}
textarea::placeholder,input::placeholder{color:var(--txt3)}
input[type=range]{width:100%;accent-color:var(--txt)}
#app{max-width:480px;margin:0 auto;padding:1rem 1rem 5rem}
.hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:1rem;border-bottom:0.5px solid var(--brd);margin-bottom:1.25rem}
.logo{font-size:12px;font-weight:500;color:var(--txt2);letter-spacing:.12em;text-transform:uppercase}
.badge{font-size:11px;background:var(--bg2);border:0.5px solid var(--brd);color:var(--txt2);padding:3px 10px;border-radius:20px}
.card{background:var(--bg);border:0.5px solid var(--brd);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:10px}
.card-d{background:var(--d-bg);border:0.5px solid var(--d-brd);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:10px}
.card-i{background:var(--i-bg);border:0.5px solid var(--i-brd);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:10px}
.lbl{font-size:11px;font-weight:500;color:var(--txt2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.lbl-d{font-size:11px;font-weight:500;color:var(--d-txt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.lbl-i{font-size:11px;font-weight:500;color:var(--i-txt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.lbl-s{font-size:11px;font-weight:500;color:var(--s-txt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.lbl-w{font-size:11px;font-weight:500;color:var(--w-txt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.txt{font-size:14px;color:var(--txt);line-height:1.6}
.h1{font-size:22px;font-weight:500;color:var(--txt);line-height:1.3;margin-bottom:.5rem}
.sub{font-size:14px;color:var(--txt2);line-height:1.6}
.qnum{font-size:11px;color:var(--txt2);margin-bottom:6px}
.qtxt{font-size:16px;font-weight:500;line-height:1.5;margin-bottom:.5rem}
.hint{font-size:13px;color:var(--txt2);line-height:1.5;margin-bottom:.75rem}
.btn-p{background:var(--txt);color:var(--bg);border:none;border-radius:var(--r);padding:.75rem 1.5rem;font-size:15px;font-weight:500;cursor:pointer;width:100%;display:block;margin-bottom:8px}
.btn-s{background:transparent;color:var(--txt2);border:0.5px solid var(--brd2);border-radius:var(--r);padding:.75rem 1.5rem;font-size:14px;cursor:pointer;width:100%;display:block;margin-bottom:8px}
.btn-icon{background:none;border:none;cursor:pointer;color:var(--txt2);font-size:22px;padding:4px;line-height:1}
.btn-back{background:none;border:none;cursor:pointer;color:var(--txt2);font-size:14px;display:flex;align-items:center;gap:6px;padding:0}
.btn-mode{background:var(--bg);border:0.5px solid var(--brd);border-radius:var(--rl);padding:.9rem 1.25rem;text-align:left;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.icon-box{width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.prog-bar{height:3px;background:var(--bg2);border-radius:2px;overflow:hidden;margin-top:8px;margin-bottom:1.25rem}
.prog-fill{height:100%;background:var(--txt);border-radius:2px;transition:width .3s}
.metric{background:var(--bg2);border-radius:var(--r);padding:.75rem;text-align:center}
.nav{position:fixed;bottom:0;left:0;right:0;border-top:0.5px solid var(--brd);display:flex;background:var(--bg);padding:8px 0 12px;z-index:100}
.nav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10px;color:var(--txt3)}
.nav-btn.active{color:var(--txt)}
.nav-btn i{font-size:22px}
.checkin-q{border-top:0.5px solid var(--brd);border-bottom:0.5px solid var(--brd);padding:1.5rem 0;margin-bottom:1.25rem;text-align:center;font-size:17px;font-weight:500;line-height:1.5}
.done-center{text-align:center;padding:3rem 0 2rem}
.try-item{display:flex;gap:10px;margin-bottom:10px}
.try-num{width:22px;height:22px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--txt2);flex-shrink:0;margin-top:2px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:1.25rem}
.sep{border-top:0.5px solid var(--brd);margin:1.5rem 0 1.25rem}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
var ce=React.createElement;
var useState=React.useState;
var useEffect=React.useEffect;

var WEEKLY_QS=[
  {key:"q1",phase:"不満を可視化する",q:"「まあ仕方ない」と受け入れて我慢し続けていることは何か?",rows:3},
  {key:"q2",phase:"不満を可視化する",q:"繰り返し不満を言うのに、実際には変えていないことを3つ挙げるとしたら?",rows:3},
  {key:"q3",phase:"不満を可視化する",q:"その不満を、言葉ではなく行動だけ見ていた人がいたら、あなたが本当は何を求めていると結論づけるか?",rows:3},
  {key:"q4",phase:"不満を可視化する",q:"深く尊敬する人になら認めるのが耐えられない、今の生活についての真実は何か?",rows:3},
  {key:"q5",phase:"アンチビジョンを構築する",q:"この先5年、何も変わらなかったら、ある平均的な火曜日を描写してください。",hint:"どこで目覚め、体はどう感じ、最初に何を考え、周りに誰がいて、9〜18時は何をし、22時はどんな気分か。",rows:5},
  {key:"q6",phase:"アンチビジョンを構築する",q:"それを10年後でやってみてください。",hint:"何を失ったか。どんな機会が閉じたか。誰があなたを諦めたか。",rows:5},
  {key:"q7",phase:"アンチビジョンを構築する",q:"人生の終わり。安全な選択だけをしてきたとしたら、その代償は何か?",hint:"感じること・挑戦すること・なることを、自分に許さなかったものは?",rows:4},
  {key:"q8",phase:"アンチビジョンを構築する",q:"今描いた未来を、既に生きている人が周りにいないか? その人になると考えると何を感じるか?",rows:3},
  {key:"q9",phase:"アンチビジョンを構築する",q:"本当に変わるために手放すべきアイデンティティは何か?",hint:"「私は〜な人間だ」という形で。手放す社会的コストは?",rows:3},
  {key:"q10",phase:"アンチビジョンを構築する",q:"変われていない一番きまり悪い理由は何か?",hint:"弱い・怖い・怠けていると聞こえる、格好悪い本当の理由。",rows:3},
  {key:"q11",phase:"アンチビジョンを構築する",q:"今の行動が自己防衛だとしたら、具体的に何を守っているのか? その代償は?",rows:3},
  {key:"antivision",phase:"アンチビジョンを圧縮する",q:"「絶対にこうなりたくない」を一文で。",hint:"読むたびに何か感じるものにする。",rows:3},
  {key:"q13",phase:"ビジョンを構築する",q:"現実性を忘れて。3年後、指を鳴らして違う人生を生きられるなら、本当は何を望むか?",hint:"平均的な火曜日はどんな一日か。Q5と同じ粒度で。",rows:5},
  {key:"q14",phase:"ビジョンを構築する",q:"その人生が無理せず自然に感じるには、自分について何を信じている必要があるか?",hint:"「私は〜な人間だ」というアイデンティティ宣言。",rows:3},
  {key:"q15",phase:"ビジョンを構築する",q:"もし既にその人間だとしたら、今週やることは何か?",rows:3},
  {key:"vision",phase:"ビジョンを圧縮する",q:"向かっている先を一文で。",hint:"進化するものと知りつつ、今のVision MVPを。",rows:3},
  {key:"q17",phase:"統合する",q:"今週を経て、自分が行き詰まっていた本当の理由について、一番しっくりくるものは何か?",rows:3},
  {key:"q18",phase:"統合する",q:"本当の敵は何か?",hint:"状況や他人のせいではなく、支配してきた内的パターンや思い込みを一言で。",rows:2},
  {key:"goal_year",phase:"ゴールを設定する",q:"1年後の視点: 何が本当になっていれば、古いパターンを断ち切れたと分かるか?",hint:"1つの具体的なことで。",rows:3},
  {key:"goal_month",phase:"ゴールを設定する",q:"1ヶ月後の視点: 1年後の視点が現実であり続けるために、1ヶ月後に何が本当になっている必要があるか?",rows:3},
  {key:"goal_week",phase:"ゴールを設定する",q:"日々の視点: なりつつある自分なら当然やる、今週タイムブロックできる2〜3個の行動は何か?",rows:3},
  {key:"constraints",phase:"制約を決める",q:"このビジョンを実現するために、絶対に犠牲にしないものは何か?",hint:"やらないと決めるルール。",rows:3}
];
var DAILY_QS=[
  "今やっていることで、本当は何を避けているか?",
  "この2時間を誰かが録画していたら、自分が人生に何を求めていると結論づけるか?",
  "嫌いな人生に向かっているか、欲しい人生に向かっているか?",
  "本当は一番重要なのに、重要じゃないふりをしていることは何か?",
  "今日やったことのうち、本心からではなく「らしさを守るため」にやったことは何か?",
  "今、一番生きていると感じるか、一番死んでいると感じるか?",
  "「なりたい自分」だと人に思われる必要がなくなったら、何が変わるか?",
  "人生のどこで、生きている実感を安全と引き換えにしているか?",
  "明日なれる、なりたい自分の一番小さいバージョンは何か?"
];

function lsget(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsset(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsdel(k){try{localStorage.removeItem(k);}catch(e){}}

function OHdr(p){
  return ce("div",{className:"hdr"},
    ce("button",{className:"btn-back",onClick:p.onBack},ce("i",{className:"ti ti-arrow-left"})," 戻る"),
    ce("span",{style:{fontSize:14,fontWeight:500}},p.title),
    ce("span",{style:{width:60}}));
}

function Chart(p){
  var data=p.data;
  if(!data||!data.length)return ce("div",{style:{textAlign:"center",padding:"1.5rem",fontSize:14,color:"var(--txt2)"}},"週次の深掘りを記録するとグラフが表示されます");
  var W=320,H=110,pl=24,pr=8,pt=8,pb=22,iW=W-pl-pr,iH=H-pt-pb,n=data.length;
  function px(i){return pl+(n<2?iW/2:i/(n-1)*iW);}
  function py(s){return pt+iH-(s-1)/9*iH;}
  var pts=data.map(function(d,i){return {x:px(i),y:py(d.score),s:d.score,dt:d.date};});
  var poly=pts.map(function(p){return p.x+","+p.y;}).join(" ");
  var lblIdx=n<=6?data.map(function(_,i){return i;}):data.map(function(_,i){return i;}).filter(function(i){return i===0||i===n-1||i%Math.ceil(n/5)===0;});
  return ce("svg",{viewBox:"0 0 "+W+" "+H,width:"100%",style:{display:"block"}},
    [1,5,10].map(function(v){return ce("g",{key:v},
      ce("line",{x1:pl,y1:py(v),x2:W-pr,y2:py(v),stroke:"rgba(0,0,0,0.08)",strokeWidth:0.5,strokeDasharray:"3 3"}),
      ce("text",{x:pl-3,y:py(v)+4,fontSize:9,fill:"var(--txt2)",textAnchor:"end"},v));}),
    ce("polyline",{points:poly,fill:"none",stroke:"var(--txt)",strokeWidth:2,strokeLinejoin:"round",strokeLinecap:"round"}),
    pts.map(function(p,i){return ce("circle",{key:i,cx:p.x,cy:p.y,r:3,fill:"var(--txt)"});}),
    lblIdx.map(function(i){return ce("text",{key:i,x:px(i),y:H-5,fontSize:9,fill:"var(--txt2)",textAnchor:"middle"},data[i].date);})
  );
}

function App(){
  var _sc=useState("loading"),screen=_sc[0],setScreen=_sc[1];
  var _tb=useState("home"),tab=_tb[0],setTab=_tb[1];
  var _wst=useState(0),wStep=_wst[0],setWStep=_wst[1];
  var _wa=useState({}),wAns=_wa[0],setWAns=_wa[1];
  var _cf=useState({apiKey:"",setupComplete:false,antivision:"",vision:"",setupDate:""}),cfg=_cf[0],setCfg=_cf[1];
  var _ms=useState({year:"",month:"",week:"",constraints:""}),milestones=_ms[0],setMilestones=_ms[1];
  var _dl=useState([]),dailyLogs=_dl[0],setDailyLogs=_dl[1];
  var _wl=useState([]),weeklyLogs=_wl[0],setWeeklyLogs=_wl[1];
  var _hs=useState([]),hist=_hs[0],setHist=_hs[1];
  var _dq=useState(""),dailyQ=_dq[0],setDailyQ=_dq[1];
  var _da=useState(""),dailyAns=_da[0],setDailyAns=_da[1];
  var _sc2=useState(5),score=_sc2[0],setScore=_sc2[1];
  var _tr=useState([]),tries=_tr[0],setTries=_tr[1];
  var _lt=useState(false),loadTries=_lt[0],setLoadTries=_lt[1];
  var _di=useState(null),diffItem=_di[0],setDiffItem=_di[1];
  var _dn=useState({title:"",msg:""}),done=_dn[0],setDone=_dn[1];
  var _ak=useState(""),apiKey=_ak[0],setApiKey=_ak[1];

  var todayKey=new Date().toISOString().slice(0,10);

  useEffect(function(){
    var c=lsget("av-config"),m=lsget("av-milestones"),dl=lsget("av-daily-logs"),wl=lsget("av-weekly-logs"),h=lsget("av-history");
    if(c){setCfg(c);setApiKey(c.apiKey||"");}
    if(m){setMilestones(Object.assign({year:"",month:"",week:"",constraints:""},m));}
    if(dl)setDailyLogs(dl);
    if(wl)setWeeklyLogs(wl);
    if(h)setHist(h);
    setScreen(c&&c.setupComplete?"main":"welcome");
  },[]);

  function saveCfg(c){setCfg(c);lsset("av-config",c);}
  function addHist(av,v){var nh=[{antivision:av,vision:v,date:todayKey}].concat(hist).slice(0,20);setHist(nh);lsset("av-history",nh);}

  function startWeekly(){
    var prev=lsget("av-weekly-answers")||{};
    setWAns(prev);setWStep(0);setScreen("weekly");
  }
  function nextWeekly(){
    var el=document.getElementById("wta"),ans=el?el.value.trim():"";
    if(!ans){if(el)el.focus();return;}
    var q=WEEKLY_QS[wStep],na=Object.assign({},wAns);na[q.key]=ans;setWAns(na);
    if(wStep<WEEKLY_QS.length-1){setWStep(wStep+1);}
    else{setScore(5);setTries([]);setScreen("weeklyfinish");}
  }
  function prevWeekly(){
    var el=document.getElementById("wta");
    if(el&&el.value.trim()){var q=WEEKLY_QS[wStep],na=Object.assign({},wAns);na[q.key]=el.value.trim();setWAns(na);}
    if(wStep>0)setWStep(wStep-1);else setScreen("main");
  }
  function genTries(){
    var key=cfg.apiKey||apiKey;
    if(!key){alert("設定タブからAPIキーを入力してください");return;}
    setLoadTries(true);setTries([]);
    fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,
        system:"あなたはDan Koeのアンチビジョン・プロトコルのコーチです。今週の深掘りの回答を踏まえ、来週試すべき具体的なアクションを3つ提案してください。必ず次のJSON形式のみで返してください: {\"tries\":[\"アクション1\",\"アクション2\",\"アクション3\"]}",
        messages:[{role:"user",content:"アンチビジョン: "+wAns.antivision+"\nビジョン: "+wAns.vision+"\n今年の目標: "+wAns.goal_year+"\n今月の目標: "+wAns.goal_month+"\n今週の行動: "+wAns.goal_week+"\nスコア: "+score+"/10"}]})
    }).then(function(r){return r.json();}).then(function(d){
      var text=(d.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("");
      var p=JSON.parse(text.replace(/```json|```/g,"").trim());
      setTries(p.tries||[]);
    }).catch(function(){setTries(["提案の取得に失敗しました。APIキーを確認してください。"]);
    }).finally(function(){setLoadTries(false);});
  }
  function finishWeekly(){
    var changed=cfg.antivision&&(wAns.antivision!==cfg.antivision||wAns.vision!==cfg.vision);
    if(changed)addHist(cfg.antivision,cfg.vision);
    var c=Object.assign({},cfg,{setupComplete:true,antivision:wAns.antivision,vision:wAns.vision,apiKey:apiKey,setupDate:cfg.setupDate||todayKey});
    saveCfg(c);
    var ms={year:wAns.goal_year,month:wAns.goal_month,week:wAns.goal_week,constraints:wAns.constraints};
    setMilestones(ms);lsset("av-milestones",ms);
    lsset("av-weekly-answers",wAns);
    var wl=[{date:todayKey,score:score,tries:tries}].concat(weeklyLogs).slice(0,52);
    setWeeklyLogs(wl);lsset("av-weekly-logs",wl);
    setDone({title:"週次の深掘り完了",msg:"アンチビジョン・ビジョン・目標を更新しました。"});
    setScreen("done");
  }

  function startDaily(){
    setDailyQ(DAILY_QS[Math.floor(Math.random()*DAILY_QS.length)]);setDailyAns("");setScreen("daily");
  }
  function saveDaily(){
    var nl=dailyLogs.concat([{date:todayKey,question:dailyQ,answer:dailyAns.trim()}]);
    setDailyLogs(nl);lsset("av-daily-logs",nl);
    setDone({title:"記録しました",msg:"オートパイロットを止めました。"});
    setScreen("done");
  }

  var dailyDoneToday=dailyLogs.some(function(l){return l.date===todayKey;});
  var lastWeekly=weeklyLogs[0];
  var daysSinceWeekly=lastWeekly?Math.floor((Date.now()-new Date(lastWeekly.date).getTime())/86400000):null;
  var weeklyStatus=daysSinceWeekly===null?"未実施":(daysSinceWeekly===0?"今週済み":daysSinceWeekly+"日前");
  var chartData=weeklyLogs.slice(0,14).slice().reverse().map(function(l){return{date:l.date.slice(5),score:l.score};});

  if(screen==="loading")return ce("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"80vh",color:"var(--txt2)"}},"読み込み中...");

  if(screen==="welcome")return ce("div",null,
    ce("div",{className:"hdr"},ce("span",{className:"logo"},"Anti-Vision"),ce("span",{className:"badge"},"初回セットアップ")),
    ce("div",{style:{marginBottom:"1.5rem"}},ce("div",{className:"h1"},"人生を書き換える"),ce("div",{className:"sub"},"Dan Koeのアンチビジョン・プロトコル。週1回の深掘りと、毎日の軽い自問の2本立てです。")),
    ce("div",{className:"card"},
      ce("div",{className:"lbl"},"Claude API キー(任意)"),
